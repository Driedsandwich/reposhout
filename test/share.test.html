<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>RepoShout — 文面生成テスト（ブラウザ版）</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; margin: 2rem auto; max-width: 62rem; padding: 0 1rem; line-height: 1.6; }
  h1 { font-size: 1.4rem; }
  .summary { padding: .75rem 1rem; border-radius: 6px; font-weight: 700; margin: 1rem 0; }
  .ok { background: #e6f4ea; color: #1e7e34; }
  .ng { background: #fdecea; color: #b3261e; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  th, td { border: 1px solid #d1d9e0; padding: .35rem .5rem; text-align: left; vertical-align: top; }
  th { background: #f6f8fa; }
  tr.fail td { background: #fdecea; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  p.note { color: #57606a; font-size: .85rem; }
</style>
</head>
<body>
<h1>RepoShout — 文面生成テスト（ブラウザ版）</h1>
<p class="note">
  目視確認用の補助ページです。<strong>正式なテストは <code>npm test</code></strong>（Node）で、
  期待値の表 <code>test/fixtures.js</code> はこのページと共通です。片方だけ直しても、もう片方で落ちます。
  実ファイル <code>../src/share.js</code> をそのまま読み込んでいます。
</p>
<div id="summary" class="summary">実行中…</div>
<table id="table">
  <thead><tr><th>種別</th><th>ケース</th><th>期待</th><th>実際</th></tr></thead>
  <tbody></tbody>
</table>

<script src="../src/share.js"></script>
<script src="fixtures.js"></script>
<script>
(function () {
  'use strict';
  var rows = [];
  var fail = 0;

  function check(group, label, want, got) {
    var ok = String(want) === String(got);
    if (!ok) fail++;
    rows.push({ group: group, label: label, want: want, got: got, ok: ok });
  }

  var F = window.GXS_FIXTURES;

  F.WEIGHT.forEach(function (r) {
    check('重み', r[0] + ' / ' + JSON.stringify(r[1]), r[2], GXS.weightedLength(r[1]));
  });

  F.URLS.forEach(function (r) {
    check('URL', r[0], r[2], GXS.canonicalUrl(r[1], null));
  });

  /*
   * タイトルの整形と種別判定の表は、第15回監査 R15-001 で無くなった
   * （タイトルを送らず、型で決まるルートだけを共有する）。
   */
  F.BUILD.forEach(function (r) {
    var got = GXS.buildShare(r[1]);
    var want = r[2];
    if (want.isNull) { check('組み立て', r[0], 'null', got === null ? 'null' : JSON.stringify(got)); return; }
    if (!got) { check('組み立て', r[0], '結果あり', 'null'); return; }
    if (want.kind) check('組み立て', r[0] + ' [kind]', want.kind, got.kind);
    if (want.repo) check('組み立て', r[0] + ' [repo]', want.repo, got.repo);
    if (want.text) check('組み立て', r[0] + ' [text]', want.text, got.text);
    if (want.url) check('組み立て', r[0] + ' [url]', want.url, got.url);
    if (want.endsWith) check('組み立て', r[0] + ' [末尾]', true, got.text.slice(-want.endsWith.length) === want.endsWith);
    if (want.notContains) check('組み立て', r[0] + ' [含まない]', true, got.text.indexOf(want.notContains) === -1);
    if (want.weightMax) check('組み立て', r[0] + ' [重み<=' + want.weightMax + ']', true, GXS.weightedLength(got.text) <= want.weightMax);
    if (want.xTotalMax) {
      check('組み立て', r[0] + ' [合計<=' + want.xTotalMax + ']', true,
        (GXS.weightedLength(got.text) + 1 + GXS.URL_WEIGHT) <= want.xTotalMax);
    }
  });

  // 切り詰めの安全性: 絵文字を境界のあらゆる位置へ動かす
  for (var i = 190; i <= 260; i++) {
    var s = 'a'.repeat(i) + '👍' + 'b'.repeat(400);
    var out = GXS.truncate(s);
    var safe = true;
    try { encodeURIComponent(out); } catch (e) { safe = false; }
    check('切り詰め', '絵文字位置 ' + i, 'safe/重み<=' + GXS.MAX_WEIGHT,
      (safe ? 'safe' : 'URIError') + '/重み' + (GXS.weightedLength(out) <= GXS.MAX_WEIGHT ? '<=' : '>') + GXS.MAX_WEIGHT);
  }

  var tbody = document.querySelector('#table tbody');
  rows.forEach(function (r) {
    var tr = document.createElement('tr');
    if (!r.ok) tr.className = 'fail';
    [r.group, r.label, r.want, r.got].forEach(function (v) {
      var td = document.createElement('td');
      var c = document.createElement('code');
      c.textContent = String(v);
      td.appendChild(c);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  var el = document.getElementById('summary');
  el.className = 'summary ' + (fail === 0 ? 'ok' : 'ng');
  el.textContent = fail === 0
    ? rows.length + ' 件すべて期待どおり'
    : rows.length + ' 件中 ' + fail + ' 件が期待と違います';
  window.__TEST_RESULT__ = { total: rows.length, fail: fail };
})();
</script>
</body>
</html>
