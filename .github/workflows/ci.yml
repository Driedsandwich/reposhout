name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 既定を読み取りだけに落とす。このワークフローは何も書き込まない。
permissions:
  contents: read

jobs:
  # 利用者の環境に Windows がいるので、コードがそこでも動くことを実測する。
  # 実拡張E2E は openssl と Chrome の場所が環境依存なので Ubuntu 側だけで回す。
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # チェックアウト後にトークンを .git/config へ残さない
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # 依存のインストール時スクリプトは走らせない。
      # 木の中で唯一 postinstall を持つのは core-js（寄付の案内を出すだけ）で、
      # 走らせなくても全テストが通ることを実測している。
      - run: npm ci --ignore-scripts
      - name: 単体テスト（Windows）
        run: npm run test:unit
      - name: 配布物を作れること（Windows）
        run: npm run package

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Action は可変タグ（@v7）ではなく完全なcommit SHAで固定する。
      # タグは付け替えられるので、同じ記述でも中身が入れ替わりうるため。
      # コメントの版数は人が読むためのもので、実体はSHA側。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # チェックアウト後にトークンを .git/config へ残さない
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # ubuntu-latest のランナーには Google Chrome が入っている。
      # 入っていなければE2Eは失敗させる（黙って飛ばすと「通った」に見えてしまう）。
      - name: Chrome の場所を確認する
        run: |
          which google-chrome || which google-chrome-stable || which chromium || {
            echo "Chrome が見つかりません。E2Eが実行できないので失敗させます。" >&2
            exit 1
          }
          google-chrome --version || true
          openssl version

      # 依存のインストール時スクリプトは走らせない。
      # 木の中で唯一 postinstall を持つのは core-js（寄付の案内を出すだけ）で、
      # 走らせなくても全テストが通ることを実測している。
      - run: npm ci --ignore-scripts

      - name: 単体テスト・適合テスト・manifest検査
        run: npm run test:unit

      - name: 実拡張E2E
        run: npm run test:e2e

      # PRのときは GITHUB_SHA が「PR検証用の一時マージコミット」を指す。
      # release-manifest.json にそのまま入ると、main由来の提出候補と見分けがつかない。
      # PRの head / base は環境変数に既定では入らないので、ここで明示的に渡す。
      - name: 配布物の生成と収録内容の表示
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run package

      - name: 同じ内容から同じZIPができることを確かめる
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          FIRST=$(cat dist/*.zip.sha256 | cut -d' ' -f1)
          npm run package --silent > /dev/null
          SECOND=$(cat dist/*.zip.sha256 | cut -d' ' -f1)
          echo "1回目: $FIRST"
          echo "2回目: $SECOND"
          test "$FIRST" = "$SECOND" || {
            echo "同じ入力から違うZIPができました。決定論が壊れています。" >&2
            exit 1
          }

      # 提出候補を残すのは main への push と手動実行のときだけ。
      # PRでも同じ名前で残していたので、所有者が「main由来の提出物」と取り違えられた
      # （第5回監査 R5-003）。PRでは作れることの確認までにして、成果物は残さない。
      - name: 提出候補を残す（main への push と手動実行のときだけ）
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reposhout-package-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: 成果物を残さなかったことを表示する（PRのとき）
        if: github.event_name == 'pull_request'
        run: |
          echo "PRの検証ビルドなので成果物は残しません。"
          echo "ストアへ出すZIPは、main への push で走ったこの CI の成果物を使ってください。"
          cat dist/release-manifest.json | head -20
