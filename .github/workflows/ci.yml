name: CI

on:
  push:
    branches: [main]
    # タグを打った直後にも走らせる。公開状態の検査は、タグが実在する状態でしか
    # 何も確かめられない（第7回監査 R7-003）。成果物は main への push のときだけ残す。
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 既定を読み取りだけに落とす。このワークフローは何も書き込まない。
permissions:
  contents: read

jobs:
  # 利用者の環境に Windows がいるので、コードがそこでも動くことを実測する。
  # 実拡張E2E は openssl と Chrome の場所が環境依存なので Ubuntu 側だけで回す。
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # チェックアウト後にトークンを .git/config へ残さない
          persist-credentials: false
          # 履歴とタグを全部取る。公開状態の検査は「タグの指す先」と「そのコミットが
          # main にあるか」を git に聞くので、浅いチェックアウトでは何も確かめられない
          # （第7回監査 R7-003）。このリポジトリは小さいので全部取る
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # 依存のインストール時スクリプトは走らせない。
      # 木の中で唯一 postinstall を持つのは core-js（寄付の案内を出すだけ）で、
      # 走らせなくても全テストが通ることを実測している。
      - run: npm ci --ignore-scripts
      - name: 単体テスト（Windows）
        run: npm run test:unit
      - name: 配布物を作れること（Windows）
        run: npm run package

      # 自作の読み手だけに頼らない。標準実装でも開けることを確かめる
      # （第7回監査 R7-004: 自作readerがCRCを見ておらず、標準の unzip が拒否するZIPを通していた）
      - name: 標準の実装でもZIPを開けること（Windows）
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $out = Join-Path $env:RUNNER_TEMP 'unpacked'
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip.FullName, $out)
          if (-not (Test-Path (Join-Path $out 'manifest.json'))) {
            Write-Error '展開したフォルダの直下に manifest.json がありません'
            exit 1
          }
          $n = (Get-ChildItem -Recurse -File $out).Count
          Write-Host ("展開できたファイル数: " + $n)

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Action は可変タグ（@v7）ではなく完全なcommit SHAで固定する。
      # タグは付け替えられるので、同じ記述でも中身が入れ替わりうるため。
      # コメントの版数は人が読むためのもので、実体はSHA側。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # チェックアウト後にトークンを .git/config へ残さない
          persist-credentials: false
          # 履歴とタグを全部取る。公開状態の検査は「タグの指す先」と「そのコミットが
          # main にあるか」を git に聞くので、浅いチェックアウトでは何も確かめられない
          # （第7回監査 R7-003）。このリポジトリは小さいので全部取る
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # ubuntu-latest のランナーには Google Chrome が入っている。
      # 入っていなければE2Eは失敗させる（黙って飛ばすと「通った」に見えてしまう）。
      - name: Chrome の場所を確認する
        run: |
          which google-chrome || which google-chrome-stable || which chromium || {
            echo "Chrome が見つかりません。E2Eが実行できないので失敗させます。" >&2
            exit 1
          }
          google-chrome --version || true
          openssl version

      # 依存のインストール時スクリプトは走らせない。
      # 木の中で唯一 postinstall を持つのは core-js（寄付の案内を出すだけ）で、
      # 走らせなくても全テストが通ることを実測している。
      - run: npm ci --ignore-scripts

      - name: 単体テスト・適合テスト・manifest検査
        run: npm run test:unit

      - name: 実拡張E2E
        run: npm run test:e2e

      # 第21回監査 R21-004。検査が「落ちるべきときに落ちる」ことを毎回確かめる。
      # ⚠️ 変異が当たらなかったものは「素通り」と区別して**失敗**にする
      #    （第20回に、当たっていない変異15件を素通りと読み違えた）。
      - name: 変異対照（検査が効いていることの確認）
        run: npm run test:mutations -- --receipt mutation-receipt.json

      - name: 変異対照の証跡を残す
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-receipt-${{ github.sha }}
          path: mutation-receipt.json
          if-no-files-found: warn

      # PRのときは GITHUB_SHA が「PR検証用の一時マージコミット」を指す。
      # release-manifest.json にそのまま入ると、main由来の提出候補と見分けがつかない。
      # PRの head / base は環境変数に既定では入らないので、ここで明示的に渡す。
      - name: 配布物の生成と収録内容の表示
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run package

      # タグを打った直後に走ったときだけ、そのタグ自身を検証する。
      # 「過去の確定済みの行を検証する」だけでは、いま付けたタグが正しいかを見ていない
      # （第8回監査 R8-004）。tag名・指す先・main に入っているかを、ここで直接見る。
      - name: いま付けたタグを検証する（タグpushのときだけ）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG / manifest=$VERSION / sha=$GITHUB_SHA"

          test "$TAG" = "v$VERSION" || {
            echo "タグ名と manifest の版が違います: $TAG ≠ v$VERSION" >&2
            exit 1
          }
          PEELED=$(git rev-parse "$TAG^{}")
          test "$PEELED" = "$GITHUB_SHA" || {
            echo "タグの指す先が GITHUB_SHA と違います: $PEELED ≠ $GITHUB_SHA" >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "このコミットは origin/main に入っていません: $GITHUB_SHA" >&2
            exit 1
          }
          echo "✅ タグ $TAG は manifest と一致し、main に入っているコミットを指しています"

      # 自作の読み手だけに頼らない。標準実装でも開けることを確かめる
      # （第7回監査 R7-004: 自作readerがCRCを見ておらず、標準の unzip が拒否するZIPを通していた）
      - name: 標準の実装でもZIPを開けること（Ubuntu）
        run: |
          ZIP=$(ls dist/*.zip | head -1)
          unzip -t "$ZIP"
          OUT="$RUNNER_TEMP/unpacked"
          mkdir -p "$OUT"
          unzip -q "$ZIP" -d "$OUT"
          test -f "$OUT/manifest.json" || {
            echo "展開したフォルダの直下に manifest.json がありません" >&2
            exit 1
          }
          echo "展開できたファイル数: $(find "$OUT" -type f | wc -l)"

      - name: 同じ内容から同じZIPができることを確かめる
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # 2回目を「前の dist を消してから」走らせる。消さずに読み直すと、
          # 2回目が何もしなくても同じハッシュが読めて通ってしまう（第9回監査 R9-006）。
          FIRST_ZIP=$(ls dist/*.zip | head -1)
          FIRST=$(cat dist/*.zip.sha256 | cut -d' ' -f1)
          cp "$FIRST_ZIP" "$RUNNER_TEMP/first.zip"

          rm -rf dist
          npm run package --silent > /dev/null

          test -f dist/release-manifest.json || {
            echo "2回目のビルドが記録を作っていません（何も作っていない疑い）" >&2
            exit 1
          }
          N=$(find dist -maxdepth 1 -type f | wc -l)
          test "$N" -eq 3 || {
            echo "2回目のビルドの出力が3点ではありません: $N" >&2
            exit 1
          }

          SECOND_ZIP=$(ls dist/*.zip | head -1)
          SECOND=$(cat dist/*.zip.sha256 | cut -d' ' -f1)
          echo "1回目: $FIRST"
          echo "2回目: $SECOND"
          test "$FIRST" = "$SECOND" || {
            echo "同じ入力から違うZIPができました。決定論が壊れています。" >&2
            exit 1
          }
          cmp "$RUNNER_TEMP/first.zip" "$SECOND_ZIP" || {
            echo "ハッシュは同じですがバイト列が違います。" >&2
            exit 1
          }

      # 提出候補を残すのは「main への push」だけ。
      #
      # 以前は「PRでなければ残す」だったので、workflow_dispatch を feature ブランチや
      # タグから手で回した成果物まで提出候補の名前で残りえた（第6回監査 R6-001）。
      # scripts/package.mjs の submittable の条件と、ここを同じにしておく。
      - name: 提出候補を残す（main への push のときだけ）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reposhout-package-${{ github.sha }}
          path: dist/
          retention-days: 14
          # 何も無いまま成功しないようにする（第9回監査 R9-006）
          if-no-files-found: error

      - name: 成果物を残さなかったことを表示する（main への push 以外）
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          echo "main への push ではないので、成果物は残しません（作れることの確認まで）。"
          echo "ストアへ出すZIPは、main への push で走った CI の成果物を使ってください。"
          cat dist/release-manifest.json | head -25
