name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 既定を読み取りだけに落とす。このワークフローは何も書き込まない。
permissions:
  contents: read

jobs:
  # 利用者の環境に Windows がいるので、コードがそこでも動くことを実測する。
  # 実拡張E2E は openssl と Chrome の場所が環境依存なので Ubuntu 側だけで回す。
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - name: 単体テスト（Windows）
        run: npm run test:unit
      - name: 配布物を作れること（Windows）
        run: npm run package

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Action は可変タグ（@v7）ではなく完全なcommit SHAで固定する。
      # タグは付け替えられるので、同じ記述でも中身が入れ替わりうるため。
      # コメントの版数は人が読むためのもので、実体はSHA側。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # ubuntu-latest のランナーには Google Chrome が入っている。
      # 入っていなければE2Eは失敗させる（黙って飛ばすと「通った」に見えてしまう）。
      - name: Chrome の場所を確認する
        run: |
          which google-chrome || which google-chrome-stable || which chromium || {
            echo "Chrome が見つかりません。E2Eが実行できないので失敗させます。" >&2
            exit 1
          }
          google-chrome --version || true
          openssl version

      - run: npm ci

      - name: 単体テスト・適合テスト・manifest検査
        run: npm run test:unit

      - name: 実拡張E2E
        run: npm run test:e2e

      - name: 配布物の生成と収録内容の表示
        run: npm run package

      - name: 同じ内容から同じZIPができることを確かめる
        run: |
          FIRST=$(cat dist/*.zip.sha256 | cut -d' ' -f1)
          npm run package --silent > /dev/null
          SECOND=$(cat dist/*.zip.sha256 | cut -d' ' -f1)
          echo "1回目: $FIRST"
          echo "2回目: $SECOND"
          test "$FIRST" = "$SECOND" || {
            echo "同じ入力から違うZIPができました。決定論が壊れています。" >&2
            exit 1
          }

      - name: 生成物を残す
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reposhout-package
          path: dist/
          retention-days: 14
